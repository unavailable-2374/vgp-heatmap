<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════════
  VGP Genome Pairwise Heatmap Viewer
  Triangle / diamond layout (matrix rotated 45°, dendrogram on top).
  2 pages: Similarity (symmetric) + Coverage (directional, split diamonds).

  IMPORTANT: This file uses fetch() to load `heatmap_data.json`, so it MUST be
  served over HTTP, not opened via the file:// protocol. From this directory:

      python -m http.server 8000

  then open  http://localhost:8000/index.html

  Self-contained: no build step, no external CDN dependencies.
  ════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VGP Pairwise Heatmap Viewer</title>
<style>
:root {
  --bg:          #eef2f6;
  --header:      #0f172a;
  --panel-line:  #1e293b;
  --accent:      #6366f1;
  --accent-soft: #818cf8;
  --card:        #ffffff;
  --border:      #e2e8f0;
  --ink:         #0f172a;
  --ink-soft:    #334155;
  --muted:       #64748b;
  --muted-2:     #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ───────────────────────── Header ───────────────────────── */
#header {
  height: 60px;
  background: var(--header);
  border-bottom: 1px solid var(--panel-line);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 16px;
}
.brand {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
  box-shadow: 0 2px 8px rgba(99,102,241,0.45);
}
.brand-text { min-width: 0; }
.brand-text h1 {
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: #f8fafc;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-text p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
  white-space: nowrap;
}

/* Segmented page switcher */
.segmented {
  flex-shrink: 0;
  display: flex;
  gap: 3px;
  background: #1e293b;
  padding: 3px;
  border-radius: 10px;
}
.seg {
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted-2);
  padding: 7px 20px;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.14s, color 0.14s;
  white-space: nowrap;
}
.seg:hover:not(.active) { background: #28344b; color: #e2e8f0; }
.seg.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 5px rgba(99,102,241,0.5);
}

.controls {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}
#zoom-label {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 44px;
  text-align: right;
}
#reset-btn {
  background: #1e293b;
  color: #cbd5e1;
  border: 1px solid #334155;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.14s, color 0.14s, border-color 0.14s;
}
#reset-btn:hover { background: #28344b; color: #fff; border-color: #475569; }
#reset-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ───────────────────────── Canvas ───────────────────────── */
#canvas-wrap {
  width: 100%;
  height: calc(100vh - 60px);
  position: relative;
  overflow: hidden;
}
canvas { display: block; cursor: crosshair; }

/* ───────────────────────── Tooltip ───────────────────────── */
#tooltip {
  display: none;
  position: fixed;
  background: rgba(15,23,42,0.97);
  color: #e2e8f0;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 12.5px;
  pointer-events: none;
  z-index: 1000;
  max-width: 440px;
  line-height: 1.65;
  border: 1px solid rgba(148,163,184,0.18);
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
}
#tooltip .species-name { color: var(--accent-soft); font-weight: 600; }
#tooltip .common-name { color: var(--muted-2); font-style: italic; font-size: 11.5px; }
#tooltip .clade-tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 11px;
  margin-left: 4px;
}
#tooltip .val { color: #fbbf24; font-weight: 600; }
#tooltip .label { color: var(--muted-2); }
#tooltip .dir-note { color: #6ee7b7; font-size: 11px; margin-top: 3px; }
#tooltip b { color: #f1f5f9; font-weight: 600; }
#tooltip .tt-divider { border-top: 1px solid rgba(148,163,184,0.2); margin-top: 6px; padding-top: 6px; }

/* ───────────────────────── Legend ───────────────────────── */
#legend {
  position: absolute;
  bottom: 16px;
  left: 16px;
  background: rgba(255,255,255,0.95);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 11px 14px;
  box-shadow: 0 6px 20px rgba(15,23,42,0.1);
  z-index: 60;
  max-width: 86%;
}
.legend-title {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 8px;
}
.legend-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 11.5px;
  color: var(--ink-soft);
}
.legend-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.legend-item .legend-count { color: var(--muted-2); font-variant-numeric: tabular-nums; }

/* ───────────────────────── Colorbar ───────────────────────── */
#colorbar {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 60;
  background: rgba(255,255,255,0.95);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 12px 9px;
  box-shadow: 0 6px 20px rgba(15,23,42,0.1);
}
.cb-row { display: flex; align-items: flex-start; gap: 5px; }
.cb-ticks {
  position: relative;
  width: 38px;
  height: 300px;
  font-size: 10px;
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
#cb-canvas { border-radius: 3px; display: block; box-shadow: 0 1px 4px rgba(15,23,42,0.18); }
.cb-label {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  margin-top: 7px;
  max-width: 76px;
}

/* ───────────────────────── Help hint ───────────────────────── */
#help-hint {
  position: absolute;
  top: 14px; left: 16px;
  background: rgba(255,255,255,0.92);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  padding: 8px 13px;
  border-radius: 10px;
  font-size: 11.5px;
  color: var(--muted);
  border: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(15,23,42,0.08);
  z-index: 60;
  display: flex;
  gap: 9px;
  align-items: center;
}
#help-hint b { color: var(--ink-soft); font-weight: 600; }
#help-hint .hh-sep { color: #cbd5e1; }
#help-hint kbd {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10.5px;
  font-family: inherit;
  color: var(--ink-soft);
}

/* ───────────────────────── Selection info ───────────────────────── */
#selection-info {
  position: absolute;
  top: 14px; right: 16px;
  background: var(--card);
  padding: 7px 8px 7px 14px;
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--ink-soft);
  border: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(15,23,42,0.1);
  z-index: 60;
  display: none;
  align-items: center;
  gap: 10px;
}
#selection-info button {
  background: #ef4444;
  color: white;
  border: none;
  font-family: inherit;
  padding: 4px 11px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.14s;
}
#selection-info button:hover { background: #dc2626; }

/* ───────────────────────── Loading ───────────────────────── */
#loading {
  position: fixed; inset: 0;
  background: var(--header);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; color: #e2e8f0;
  flex-direction: column; gap: 18px;
}
#loading .spinner {
  width: 38px; height: 38px;
  border: 3px solid #1e293b; border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
#load-text { font-size: 14px; color: var(--muted-2); }
@keyframes spin { to { transform: rotate(360deg); } }
#error-box {
  background: #1e293b; color: #fca5a5;
  padding: 16px 22px; border-radius: 10px;
  font-size: 13px; max-width: 520px; text-align: center;
  line-height: 1.65; border: 1px solid #334155;
}
#error-box code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #e2e8f0; }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div id="load-text">Loading heatmap data…</div>
</div>

<header id="header">
  <div class="brand">
    <span class="brand-mark"></span>
    <div class="brand-text">
      <h1>VGP Pairwise Genome Heatmap</h1>
      <p>581 vertebrate genomes &middot; all-vs-all alignment</p>
    </div>
  </div>
  <div class="segmented">
    <button class="seg active" id="tab-0" data-page="0" onclick="switchPage(0)">Similarity</button>
    <button class="seg" id="tab-1" data-page="1" onclick="switchPage(1)">Coverage</button>
  </div>
  <div class="controls">
    <span id="zoom-label">1.0&times;</span>
    <button id="reset-btn" onclick="resetView()">Reset view</button>
  </div>
</header>

<div id="canvas-wrap">
  <canvas id="main-canvas"></canvas>
  <div id="help-hint">
    <span>Scroll to <b>zoom</b></span>
    <span class="hh-sep">&middot;</span>
    <span>Drag to <b>pan</b></span>
    <span class="hh-sep">&middot;</span>
    <span><kbd>Shift</kbd> + drag to <b>select</b></span>
  </div>
  <div id="selection-info">
    <span id="sel-text"></span>
    <button onclick="clearSelection()">Clear</button>
  </div>
</div>

<div id="tooltip"></div>
<div id="legend"></div>

<div id="colorbar">
  <div class="cb-row">
    <div class="cb-ticks" id="cb-ticks"></div>
    <canvas id="cb-canvas" width="24" height="300"></canvas>
  </div>
  <div class="cb-label" id="cb-label">log&#8321;&#8320;</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// Globals
// ═══════════════════════════════════════════════════════════
let DATA = null;            // the full loaded JSON
let currentPageIdx = 0;     // 0 = similarity, 1 = coverage
let PAGE = null;            // shorthand for DATA.pages[currentPageIdx]

// ── Layout (triangle / diamond) ──
// The pairwise matrix is rotated 45°: the diagonal becomes the flat top
// edge, the dendrogram sits above it, and the lower triangle hangs below
// as a downward-pointing triangle of diamond-shaped cells.
const TREE_FRAC = 0.14;        // dendrogram height as a fraction of triangle width
const VECTOR_THRESHOLD = 10;   // cell px size at/above which Coverage draws split diamonds
const LABEL_THRESHOLD  = 13;   // cell px size at/above which species labels are drawn

// View state — SHARED across both pages (zoom/pan persist on tab switch)
let unitSize = 1;           // pixels per matrix cell at zoom=1
let offsetX = 0, offsetY = 0;
let zoom = 1;
const MIN_ZOOM = 0.3, MAX_ZOOM = 50;

// Wheel-zoom sensitivity. Lower = gentler. factor = exp(-deltaY * SENS),
// with deltaY clamped so high-resolution trackpads can't make the view jump.
const ZOOM_SENSITIVITY = 0.0008;
const ZOOM_DELTA_CLAMP = 100;

// Selection (shared)
let selectedRegion = null;

// Canvas
let canvas, ctx;

// Pre-rendered overviews (1px per cell) — one per page, cached
let overviewImages = [];

// ═══════════════════════════════════════════════════════════
// Colormap
// ═══════════════════════════════════════════════════════════
const CMAP_STOPS = [
  [0.0, [33, 102, 172]],
  [0.2, [103, 169, 207]],
  [0.4, [209, 229, 240]],
  [0.6, [253, 219, 199]],
  [0.8, [239, 138, 98]],
  [1.0, [178, 24, 43]],
];

function colormap(t) {
  t = Math.max(0, Math.min(1, t));
  for (let k = 1; k < CMAP_STOPS.length; k++) {
    if (t <= CMAP_STOPS[k][0]) {
      const [t0, c0] = CMAP_STOPS[k - 1];
      const [t1, c1] = CMAP_STOPS[k];
      const f = (t - t0) / (t1 - t0);
      return [
        Math.round(c0[0] + f * (c1[0] - c0[0])),
        Math.round(c0[1] + f * (c1[1] - c0[1])),
        Math.round(c0[2] + f * (c1[2] - c0[2])),
      ];
    }
  }
  return CMAP_STOPS[CMAP_STOPS.length - 1][1];
}

// Apply the current page's color transform to a raw value.
// Returns a normalized t in [0,1], or null if value is missing/invalid.
function valToT(rawVal) {
  if (rawVal === null || rawVal === undefined) return null;
  let v = rawVal;
  if (PAGE.colorTransform === 'log10') {
    v = Math.log10(rawVal);
    if (!isFinite(v)) return null;
  }
  return (v - PAGE.vmin) / (PAGE.vmax - PAGE.vmin);
}

function valToRgbStr(rawVal) {
  const t = valToT(rawVal);
  if (t === null) return 'rgb(230,230,230)';
  const c = colormap(t);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function valToRgb(rawVal) {
  const t = valToT(rawVal);
  if (t === null) return [230, 230, 230];
  return colormap(t);
}

// ═══════════════════════════════════════════════════════════
// Coordinate system  (triangle / diamond layout)
// ═══════════════════════════════════════════════════════════
// Cell (i,j) with j >= i is a diamond centered at:
//     cx = triLeftX + (i + j) * half
//     cy = triTopY  + (j - i) * half
// where half = scale/2.  Diagonal cells (i==j) sit on the flat top edge
// (triTopY) and render as downward half-diamonds after the triangle clip.
// The whole figure is  offset + scale * const , so zoom-toward-cursor
// stays a plain uniform scale about (offsetX, offsetY).

function getScale()  { return unitSize * zoom; }
function getHalf()   { return getScale() / 2; }
function getTreeH()  { return DATA.n * getScale() * TREE_FRAC; }
function getTriLeftX() { return offsetX + getHalf(); }
function getTriTopY()  { return offsetY + getTreeH(); }

// Screen-space center of cell (i,j).
function cellCenter(i, j) {
  const h = getHalf();
  return [getTriLeftX() + (i + j) * h, getTriTopY() + (j - i) * h];
}

// Map a canvas point to the nearest cell {row,col} with row <= col,
// or null if the point is outside the heatmap triangle.
function canvasToCell(cx, cy) {
  const h = getHalf();
  if (h <= 0) return null;
  const u = (cx - getTriLeftX()) / h;   // = i + j
  const v = (cy - getTriTopY()) / h;    // = j - i
  const i = Math.round((u - v) / 2);
  const j = Math.round((u + v) / 2);
  if (i < 0 || j < 0 || i >= DATA.n || j >= DATA.n || i > j) return null;
  return { row: i, col: j };
}

// ═══════════════════════════════════════════════════════════
// Per-page overview pre-render (1px per cell)
// ═══════════════════════════════════════════════════════════
// Each pixel blends the two triangles mat[col*n+row] and mat[row*n+col].
// For the symmetric similarity matrix the blend is exact; for the
// asymmetric coverage matrix it is the mean of the two directions
// (only shown while zoomed out — split diamonds take over when zoomed in).
function prerenderOverview(pageIdx) {
  if (overviewImages[pageIdx]) return overviewImages[pageIdx];
  const savedPage = PAGE;
  PAGE = DATA.pages[pageIdx];   // valToRgb reads PAGE for transform/range

  const n = DATA.n;
  const off = document.createElement('canvas');
  off.width = n;
  off.height = n;
  const c = off.getContext('2d');
  const imgData = c.createImageData(n, n);
  const px = imgData.data;
  const mat = PAGE.matrix;

  for (let row = 0; row < n; row++) {
    for (let col = 0; col < n; col++) {
      let rgb;
      if (row === col) {
        rgb = valToRgb(mat[row * n + col]);
      } else {
        const cu = valToRgb(mat[col * n + row]);
        const cl = valToRgb(mat[row * n + col]);
        rgb = [
          (cu[0] + cl[0]) >> 1,
          (cu[1] + cl[1]) >> 1,
          (cu[2] + cl[2]) >> 1,
        ];
      }
      const idx = (row * n + col) * 4;
      px[idx] = rgb[0]; px[idx+1] = rgb[1]; px[idx+2] = rgb[2]; px[idx+3] = 255;
    }
  }
  c.putImageData(imgData, 0, 0);
  overviewImages[pageIdx] = off;
  PAGE = savedPage;
  return off;
}

// ═══════════════════════════════════════════════════════════
// Drawing
// ═══════════════════════════════════════════════════════════
function draw() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!DATA || !PAGE) return;

  const n = DATA.n;
  const scale = getScale();
  const h = scale / 2;
  const triLeftX = getTriLeftX();
  const triTopY  = getTriTopY();
  const treeH    = getTreeH();

  // Triangle corners
  const TLx = triLeftX - h,            TLy = triTopY;
  const TRx = triLeftX + (2 * n - 1) * h, TRy = triTopY;
  const APx = triLeftX + (n - 1) * h,  APy = triTopY + n * h;

  // ── Heatmap (clipped to the triangle) ──
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(TLx, TLy);
  ctx.lineTo(TRx, TRy);
  ctx.lineTo(APx, APy);
  ctx.closePath();
  ctx.clip();

  const isCoverage = PAGE.key === 'coverage';
  const useVector = isCoverage && scale >= VECTOR_THRESHOLD;

  if (!useVector) {
    // Rotate the pre-rendered overview 45° into the diamond grid.
    const ov = overviewImages[currentPageIdx];
    if (ov) {
      ctx.imageSmoothingEnabled = scale < 2.5;
      ctx.setTransform(h, h, h, -h, triLeftX - h, triTopY);
      ctx.drawImage(ov, 0, 0);
      // setTransform reset happens via restore() below
    }
  } else {
    drawCoverageDiamonds(h, triLeftX, triTopY, W, H);
  }
  ctx.restore();

  // ── Dendrogram, clade strip, labels, selection ──
  drawTreeOnCanvas(scale, triLeftX, triTopY, treeH);
  drawCladeStrip(scale, h, triLeftX, triTopY);
  if (scale >= LABEL_THRESHOLD) drawSpeciesLabels(scale, triLeftX, triTopY, W);
  if (selectedRegion) drawSelection();
}

// Split-diamond rendering for the directional Coverage page (zoomed in).
function drawCoverageDiamonds(h, triLeftX, triTopY, W, H) {
  const n = DATA.n;
  const mat = PAGE.matrix;

  let uMin = Math.floor((0 - triLeftX) / h) - 1;
  let uMax = Math.ceil((W - triLeftX) / h) + 1;
  let vMin = Math.floor((0 - triTopY) / h) - 1;
  let vMax = Math.ceil((H - triTopY) / h) + 1;
  uMin = Math.max(0, uMin);  uMax = Math.min(2 * n - 2, uMax);
  vMin = Math.max(0, vMin);  vMax = Math.min(n - 1, vMax);

  for (let v = vMin; v <= vMax; v++) {
    for (let u = uMin; u <= uMax; u++) {
      if (((u + v) & 1) !== 0) continue;          // cell centers: u,v same parity
      const i = (u - v) >> 1, j = (u + v) >> 1;
      if (i < 0 || j >= n || i > j) continue;
      const cx = triLeftX + u * h;
      const cy = triTopY  + v * h;

      if (i === j) {
        ctx.fillStyle = valToRgbStr(mat[i * n + j]);
        ctx.beginPath();
        ctx.moveTo(cx, cy - h);
        ctx.lineTo(cx + h, cy);
        ctx.lineTo(cx, cy + h);
        ctx.lineTo(cx - h, cy);
        ctx.closePath();
        ctx.fill();
      } else {
        // Upper triangle — species i covered by species j
        ctx.fillStyle = valToRgbStr(mat[i * n + j]);
        ctx.beginPath();
        ctx.moveTo(cx, cy - h);
        ctx.lineTo(cx + h, cy);
        ctx.lineTo(cx - h, cy);
        ctx.closePath();
        ctx.fill();
        // Lower triangle — species j covered by species i
        ctx.fillStyle = valToRgbStr(mat[j * n + i]);
        ctx.beginPath();
        ctx.moveTo(cx, cy + h);
        ctx.lineTo(cx + h, cy);
        ctx.lineTo(cx - h, cy);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}

// Dendrogram across the top: species index → x, tree depth → y.
function drawTreeOnCanvas(scale, triLeftX, triTopY, treeH) {
  const n = DATA.n;
  const W = canvas.width;
  // leaf_y in the data = n - 0.5 - speciesIndex
  const xForLy = (ly) => triLeftX + (n - 0.5 - ly) * scale;
  // depth fraction: xf=1 at the tips (top edge), xf=0 at the root
  const yForXf = (xf) => triTopY - (1 - xf) * treeH;

  ctx.lineWidth = Math.max(0.4, Math.min(1.2, scale * 0.08));
  for (const line of DATA.treeLines) {
    const [x1f, ly1, x2f, ly2, color] = line;
    const px1 = xForLy(ly1), px2 = xForLy(ly2);
    if (Math.max(px1, px2) < -5 || Math.min(px1, px2) > W + 5) continue;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(px1, yForXf(x1f));
    ctx.lineTo(px2, yForXf(x2f));
    ctx.stroke();
  }
}

// Clade colour strip just above the heatmap, plus clade names when zoomed.
function drawCladeStrip(scale, h, triLeftX, triTopY) {
  const barH = Math.max(4, Math.min(10, scale * 0.45));
  const W = canvas.width;

  for (const [clade, [s, e]] of Object.entries(DATA.cladeRanges)) {
    const x0 = triLeftX + s * scale - h;
    const x1 = triLeftX + e * scale + h;
    if (x1 < -5 || x0 > W + 5) continue;
    const idx = DATA.cladeNames.indexOf(clade);
    const color = DATA.cladeColors[idx] || '#cccccc';
    ctx.fillStyle = color;
    ctx.fillRect(x0, triTopY - barH, x1 - x0, barH);
  }

  if (scale < 3) return;
  const fontSize = Math.min(13, Math.max(8, scale * 0.5));
  ctx.font = `600 ${fontSize}px 'Inter', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  for (const [clade, [s, e]] of Object.entries(DATA.cladeRanges)) {
    const widthPx = (e - s + 1) * scale;
    if (widthPx < 46) continue;
    const cxMid = triLeftX + ((s + e) / 2) * scale;
    if (cxMid < 0 || cxMid > W) continue;
    const y = triTopY - barH - 3;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(clade, cxMid, y);
    ctx.fillStyle = '#1e293b';
    ctx.fillText(clade, cxMid, y);
  }
}

// Species labels along the diagonal, slanted 45° (parallel to the right edge).
function drawSpeciesLabels(scale, triLeftX, triTopY, W) {
  const n = DATA.n;
  const fontSize = Math.min(13, scale * 0.6);
  ctx.font = `${fontSize}px 'Inter', sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;

  for (let i = 0; i < n; i++) {
    const x = triLeftX + i * scale;
    if (x < -5 || x > W + 5) continue;
    const label = DATA.leafOrder[i].replace(/_/g, ' ');
    ctx.save();
    ctx.translate(x, triTopY - 2);
    ctx.rotate(-Math.PI / 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(label, 5, 0);
    ctx.fillStyle = '#1e293b';
    ctx.fillText(label, 5, 0);
    ctx.restore();
  }
}

// Selection outline — a rotated rectangle through the 4 corner cell centers.
function drawSelection() {
  const { r1, r2, c1, c2 } = selectedRegion;
  const pts = [
    cellCenter(r1, c1), cellCenter(r1, c2),
    cellCenter(r2, c2), cellCenter(r2, c1),
  ];
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]);
  ctx.closePath();
  ctx.fillStyle = 'rgba(239, 68, 68, 0.10)';
  ctx.fill();
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 3]);
  ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// Tooltip
// ═══════════════════════════════════════════════════════════
function speciesLabel(idx) {
  const sp = DATA.leafOrder[idx].replace(/_/g, ' ');
  const common = (DATA.commonNames && DATA.commonNames[idx]) ? DATA.commonNames[idx] : '';
  return { sp, common };
}

function showTooltip(e, row, col) {
  const tooltip = document.getElementById('tooltip');
  const n = DATA.n;

  const rowL = speciesLabel(row);
  const colL = speciesLabel(col);
  const rowCIdx = DATA.speciesCladeIdx[row];
  const colCIdx = DATA.speciesCladeIdx[col];
  const rowClade = DATA.cladeNames[rowCIdx];
  const colClade = DATA.cladeNames[colCIdx];
  const rowCC = DATA.cladeColors[rowCIdx] || '#888';
  const colCC = DATA.cladeColors[colCIdx] || '#888';

  // mat[i*n+j] = value for species i vs species j
  const val_ab = PAGE.matrix[row * n + col];   // A -> B
  const val_ba = PAGE.matrix[col * n + row];   // B -> A

  const isCoverage = PAGE.key === 'coverage';

  const fmtSim = (v) => {
    if (v === null || v === undefined) return '<span style="color:#888">N/A</span>';
    const log = Math.log10(v);
    return `<span class="val">${v.toExponential(3)}</span> <span class="label">(log₁₀: ${log.toFixed(3)})</span>`;
  };
  const fmtCov = (v) => {
    if (v === null || v === undefined) return '<span style="color:#888">N/A</span>';
    return `<span class="val">${(v * 100).toFixed(1)}%</span>`;
  };
  const commonHtml = (c) => c ? ` <span class="common-name">(${c})</span>` : '';

  let html;
  if (row === col) {
    html = `<div><span class="species-name">${rowL.sp}</span>${commonHtml(rowL.common)}
            <span class="clade-tag" style="background:${rowCC}40;color:${rowCC}">${rowClade}</span></div>
            <div style="margin-top:4px"><span class="label">Diagonal &mdash; self comparison</span></div>`;
  } else if (isCoverage) {
    html = `<div><b>A:</b> <span class="species-name">${rowL.sp}</span>${commonHtml(rowL.common)}
            <span class="clade-tag" style="background:${rowCC}40;color:${rowCC}">${rowClade}</span></div>
            <div><b>B:</b> <span class="species-name">${colL.sp}</span>${commonHtml(colL.common)}
            <span class="clade-tag" style="background:${colCC}40;color:${colCC}">${colClade}</span></div>
            <div class="tt-divider">
              <div><span class="label">${rowL.sp} covered by ${colL.sp}:</span> ${fmtCov(val_ab)}</div>
              <div class="dir-note">Upper triangle &mdash; fraction of A's genome covered by B</div>
              <div style="margin-top:4px"><span class="label">${colL.sp} covered by ${rowL.sp}:</span> ${fmtCov(val_ba)}</div>
              <div class="dir-note">Lower triangle &mdash; fraction of B's genome covered by A</div>
            </div>`;
  } else {
    html = `<div><b>A:</b> <span class="species-name">${rowL.sp}</span>${commonHtml(rowL.common)}
            <span class="clade-tag" style="background:${rowCC}40;color:${rowCC}">${rowClade}</span></div>
            <div><b>B:</b> <span class="species-name">${colL.sp}</span>${commonHtml(colL.common)}
            <span class="clade-tag" style="background:${colCC}40;color:${colCC}">${colClade}</span></div>
            <div class="tt-divider">
              <div><span class="label">Weighted Jaccard similarity:</span> ${fmtSim(val_ab)}</div>
            </div>`;
  }

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';

  const tx = e.clientX + 16;
  const ty = e.clientY + 16;
  const rect = tooltip.getBoundingClientRect();
  tooltip.style.left = (tx + rect.width > window.innerWidth ? e.clientX - rect.width - 8 : tx) + 'px';
  tooltip.style.top = (ty + rect.height > window.innerHeight ? e.clientY - rect.height - 8 : ty) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
// Tab switching — re-render from the selected page's matrix.
// Tree / clade strip / labels / zoom / pan / selection are SHARED.
// ═══════════════════════════════════════════════════════════
function switchPage(idx) {
  if (!DATA || idx === currentPageIdx) return;
  if (idx < 0 || idx >= DATA.pages.length) return;
  currentPageIdx = idx;
  PAGE = DATA.pages[idx];

  document.querySelectorAll('.seg').forEach((t) => {
    t.classList.toggle('active', Number(t.dataset.page) === idx);
  });

  prerenderOverview(idx);
  drawColorbar();
  hideTooltip();
  requestDraw();
}

// ═══════════════════════════════════════════════════════════
// Events
// ═══════════════════════════════════════════════════════════
let isPanning = false, panStart = null;
let isSelecting = false, selCanvasStart = null;

function setupEvents() {
  canvas.addEventListener('mousemove', (e) => {
    if (isPanning || isSelecting) { hideTooltip(); return; }
    const rect = canvas.getBoundingClientRect();
    const cell = canvasToCell(e.clientX - rect.left, e.clientY - rect.top);
    if (cell) showTooltip(e, cell.row, cell.col);
    else hideTooltip();
  });

  canvas.addEventListener('mouseleave', hideTooltip);

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    if (e.shiftKey) {
      isSelecting = true;
      selCanvasStart = { x: cx, y: cy };
      e.preventDefault();
    } else {
      isPanning = true;
      panStart = { x: e.clientX, y: e.clientY, ox: offsetX, oy: offsetY };
      canvas.style.cursor = 'grabbing';
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (isPanning) {
      offsetX = panStart.ox + (e.clientX - panStart.x);
      offsetY = panStart.oy + (e.clientY - panStart.y);
      requestDraw();
    }
    if (isSelecting) {
      const rect = canvas.getBoundingClientRect();
      const c1 = canvasToCell(selCanvasStart.x, selCanvasStart.y);
      const c2 = canvasToCell(e.clientX - rect.left, e.clientY - rect.top);
      if (c1 && c2) {
        selectedRegion = {
          r1: Math.min(c1.row, c2.row),
          r2: Math.max(c1.row, c2.row),
          c1: Math.min(c1.col, c2.col),
          c2: Math.max(c1.col, c2.col),
        };
        updateSelectionInfo();
        requestDraw();
      }
    }
  });

  window.addEventListener('mouseup', () => {
    if (isPanning) { isPanning = false; canvas.style.cursor = 'crosshair'; }
    if (isSelecting) { isSelecting = false; }
  });

  // Zoom toward cursor. factor = exp of the clamped wheel delta, so a
  // single notch produces a small, smooth step.
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const oldZoom = zoom;
    const delta = Math.max(-ZOOM_DELTA_CLAMP, Math.min(ZOOM_DELTA_CLAMP, e.deltaY));
    const factor = Math.exp(-delta * ZOOM_SENSITIVITY);
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));

    const s = zoom / oldZoom;
    offsetX = mx - s * (mx - offsetX);
    offsetY = my - s * (my - offsetY);

    document.getElementById('zoom-label').textContent = `${zoom.toFixed(1)}×`;
    requestDraw();
  }, { passive: false });

  // Keyboard: number keys 1/2 switch pages
  window.addEventListener('keydown', (e) => {
    if (e.key === '1') switchPage(0);
    else if (e.key === '2') switchPage(1);
  });
}

// ═══════════════════════════════════════════════════════════
// Selection
// ═══════════════════════════════════════════════════════════
function updateSelectionInfo() {
  const info = document.getElementById('selection-info');
  if (selectedRegion) {
    const { r1, r2, c1, c2 } = selectedRegion;
    document.getElementById('sel-text').textContent =
      `Selected block: ${r2 - r1 + 1} × ${c2 - c1 + 1} species`;
    info.style.display = 'flex';
  } else {
    info.style.display = 'none';
  }
}

function clearSelection() {
  selectedRegion = null;
  updateSelectionInfo();
  requestDraw();
}

function resetView() {
  fitView();
  document.getElementById('zoom-label').textContent = '1.0×';
  requestDraw();
}

// Fit the whole triangle (dendrogram + heatmap) into the canvas.
function fitView() {
  if (!DATA) return;
  const W = canvas.width;
  const H = canvas.height;
  const n = DATA.n;
  const totalHFrac = TREE_FRAC + 0.5;          // height / width ratio of the figure
  const sW = W / n;
  const sH = H / (n * totalHFrac);
  unitSize = Math.min(sW, sH) * 0.94;
  zoom = 1;
  const scale = getScale();
  const totalW = n * scale;
  const totalH = n * scale * totalHFrac;
  offsetX = (W - totalW) / 2;
  offsetY = (H - totalH) / 2;
}

// ═══════════════════════════════════════════════════════════
// Draw scheduler
// ═══════════════════════════════════════════════════════════
let drawScheduled = false;
function requestDraw() {
  if (drawScheduled) return;
  drawScheduled = true;
  requestAnimationFrame(() => { draw(); drawScheduled = false; });
}

// ═══════════════════════════════════════════════════════════
// Colorbar & Legend
// ═══════════════════════════════════════════════════════════
function drawColorbar() {
  const cvs = document.getElementById('cb-canvas');
  const c = cvs.getContext('2d');
  for (let y = 0; y < 300; y++) {
    const t = 1 - y / 300;
    const rgb = colormap(t);
    c.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    c.fillRect(0, y, 24, 1);
  }

  const ticksDiv = document.getElementById('cb-ticks');
  const range = PAGE.vmax - PAGE.vmin;
  let html = '';

  if (PAGE.key === 'coverage' && PAGE.colorTransform === 'log10') {
    const pctStops = [1, 5, 10, 25, 50, 75, 100];
    for (const pct of pctStops) {
      const logV = Math.log10(pct / 100);
      if (logV < PAGE.vmin - 1e-9 || logV > PAGE.vmax + 1e-9) continue;
      const top = (1 - (logV - PAGE.vmin) / range) * 300;
      html += `<span style="position:absolute;top:${top}px;right:0;transform:translateY(-50%)">${pct}%</span>`;
    }
  } else {
    const step = range > 4 ? 1.0 : 0.5;
    for (let v = Math.ceil(PAGE.vmin / step) * step; v <= PAGE.vmax + 1e-9; v += step) {
      const top = (1 - (v - PAGE.vmin) / range) * 300;
      html += `<span style="position:absolute;top:${top}px;right:0;transform:translateY(-50%)">${v.toFixed(1)}</span>`;
    }
  }
  ticksDiv.innerHTML = html;

  const lbl = document.getElementById('cb-label');
  if (PAGE.key === 'coverage') {
    lbl.textContent = 'Coverage';
  } else {
    lbl.innerHTML = 'log₁₀(wJ)';
  }
}

function drawLegend() {
  const div = document.getElementById('legend');
  const order = [
    "Aves","Crocodilia","Testudines","Lepidosauria","Mammalia","Amphibia",
    "Sarcopterygii","Actinopterygii","Chondrichthyes","Cyclostomata",
    "Tunicata","Cephalochordata","Ambulacraria"
  ];
  const all = order.slice();
  for (const cl of Object.keys(DATA.cladeRanges)) {
    if (!all.includes(cl)) all.push(cl);
  }
  let items = '';
  for (const cl of all) {
    const r = DATA.cladeRanges[cl];
    if (!r) continue;
    const idx = DATA.cladeNames.indexOf(cl);
    const color = (idx >= 0 ? DATA.cladeColors[idx] : '#CCCCCC') || '#CCCCCC';
    items += `<div class="legend-item"><div class="legend-swatch" style="background:${color}"></div>`
           + `${cl} <span class="legend-count">${r[1]-r[0]+1}</span></div>`;
  }
  div.innerHTML = `<div class="legend-title">Clades</div><div class="legend-items">${items}</div>`;
}

// ═══════════════════════════════════════════════════════════
// Resize & Init
// ═══════════════════════════════════════════════════════════
function resize() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  if (DATA) {
    fitView();
    requestDraw();
  }
}

function showError(msg) {
  const loading = document.getElementById('loading');
  loading.innerHTML = `<div id="error-box">${msg}</div>`;
  loading.style.display = 'flex';
}

async function init() {
  canvas = document.getElementById('main-canvas');
  ctx = canvas.getContext('2d');
  resize();

  let resp;
  try {
    resp = await fetch('heatmap_data.json');
  } catch (e) {
    showError('Failed to load heatmap_data.json (network error).<br>'
      + 'This page must be served over HTTP — run<br>'
      + '<code>python -m http.server</code> in this directory.');
    return;
  }
  if (!resp.ok) {
    showError(`Failed to load heatmap_data.json (HTTP ${resp.status}).<br>`
      + 'Make sure the file exists in this directory.');
    return;
  }
  try {
    DATA = await resp.json();
  } catch (e) {
    showError('heatmap_data.json is not valid JSON.<br>' + e.message);
    return;
  }

  if (!DATA.pages || !DATA.pages.length || !DATA.n) {
    showError('heatmap_data.json is missing required fields (pages / n).');
    return;
  }

  document.getElementById('load-text').textContent = 'Rendering heatmap…';
  await new Promise(r => setTimeout(r, 30));

  currentPageIdx = 0;
  PAGE = DATA.pages[0];

  prerenderOverview(0);

  fitView();
  drawColorbar();
  drawLegend();
  setupEvents();
  requestDraw();

  document.getElementById('loading').style.display = 'none';
  window.addEventListener('resize', resize);
}

init();
</script>
